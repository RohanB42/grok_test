name: Isotope verify
on: [pull_request]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run customer contract tests
        run: npm test
      - uses: hmartel222/hophacksf26/action@openai-provider-harness
        with:
          mode: verify
          reasoner: on
          repair: off
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
