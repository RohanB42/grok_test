name: Isotope verify
on: [pull_request]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hmartel222/hophacksf26@main
        with:
          mode: verify
          reasoner: on
          repair: off
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
